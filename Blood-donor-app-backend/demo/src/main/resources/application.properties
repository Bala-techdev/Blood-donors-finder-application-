spring.application.name=demo
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/blood_donor
spring.datasource.username=${DB_USERNAME:name}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:key}

app.emergency.escalation-delay-ms=${EMERGENCY_ESCALATION_DELAY_MS:300000}
app.emergency.escalation-cooldown-minutes=${EMERGENCY_ESCALATION_COOLDOWN_MINUTES:30}
app.emergency.urgent-recommendation-delay-minutes=${EMERGENCY_URGENT_RECOMMENDATION_DELAY_MINUTES:30}

app.fulfillment.cleanup-retention-days=${FULFILLMENT_CLEANUP_RETENTION_DAYS:10}
app.fulfillment.cleanup-delay-ms=${FULFILLMENT_CLEANUP_DELAY_MS:3600000}

app.ml.url=${SMARTBLOOD_ML_URL:http://localhost:8000/predict}
app.ml.connect-timeout-ms=${SMARTBLOOD_ML_CONNECT_TIMEOUT_MS:2000}
app.ml.read-timeout-ms=${SMARTBLOOD_ML_READ_TIMEOUT_MS:3000}
app.matching.rule-weight=${SMARTBLOOD_MATCHING_RULE_WEIGHT:0.85}
app.matching.response-weight=${SMARTBLOOD_MATCHING_RESPONSE_WEIGHT:0.15}
app.matching.outreach-candidate-multiplier=${SMARTBLOOD_OUTREACH_CANDIDATE_MULTIPLIER:3}
