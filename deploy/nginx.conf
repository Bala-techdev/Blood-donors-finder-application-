# ========================================================
# SmartBlood Production Reverse Proxy & TLS Configuration
# Item 14: Hardened Nginx configuration with TLS termination,
# HTTP-to-HTTPS redirection, and standard security headers.
# ========================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Spring Boot Backend
    upstream spring_backend {
        server backend:8080;
        keepalive 32;
    }

    # Upstream React Frontend
    upstream react_frontend {
        server frontend:80;
        keepalive 16;
    }

    # ====================================================
    # 1. HTTP Server - Automatic Redirect to HTTPS
    # ====================================================
    server {
        listen 80;
        listen [::]:80;
        server_name smartblood.org www.smartblood.org localhost;

        # Enforce instant permanent redirection to HTTPS
        return 301 https://$host$request_uri;
    }

    # ====================================================
    # 2. HTTPS Server - TLS Termination & Proxy Pass
    # ====================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name smartblood.org www.smartblood.org localhost;

        # TLS Certificates (Mount volume in production)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS Ciphers & Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 http://localhost:5173;" always;

        # Client body size limit
        client_max_body_size 10M;

        # ================================================
        # Proxy /api requests to Spring Boot Backend
        # ================================================
        location /api/ {
            proxy_pass http://spring_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Cookie & CORS header preservation
            proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        }

        # Swagger / OpenAPI documentation endpoints
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================================================
        # Frontend Single Page Application (SPA)
        # ================================================
        location / {
            proxy_pass http://react_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
