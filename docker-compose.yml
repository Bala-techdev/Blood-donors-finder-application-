services:
  # ----------------------------------------------------
  # MySQL Database
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: smartblood-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blood_donor
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-blood_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-blood_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Blood-donor-app-backend/demo/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - smartblood-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Machine Learning Service (FastAPI)
  # ----------------------------------------------------
  ml:
    build:
      context: ./smartblood-ml
      dockerfile: Dockerfile
    container_name: smartblood-ml
    restart: unless-stopped
    environment:
      ML_ALLOWED_ORIGINS: "http://backend:8080,http://localhost:8080"
      SMARTBLOOD_MONITORING_TOKEN: ${SMARTBLOOD_MONITORING_TOKEN:-}
    networks:
      - smartblood-net

  # ----------------------------------------------------
  # Backend Service (Spring Boot 3)
  # ----------------------------------------------------
  backend:
    build:
      context: ./Blood-donor-app-backend/demo
      dockerfile: Dockerfile
    container_name: smartblood-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blood_donor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-blood_user}
      DB_PASSWORD: ${DB_PASSWORD:-blood_secret}
      JWT_SECRET: ${JWT_SECRET:-smartblood_super_secure_jwt_secret_key_min_32_chars_256bit!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      SMARTBLOOD_ML_URL: http://ml:8000/predict
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    networks:
      - smartblood-net

  # ----------------------------------------------------
  # Frontend Service (React + Vite)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./Blood-donor-app
      dockerfile: Dockerfile
    container_name: smartblood-frontend
    restart: unless-stopped
    networks:
      - smartblood-net

  # ----------------------------------------------------
  # Nginx TLS Reverse Proxy
  # ----------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: smartblood-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smartblood-net

networks:
  smartblood-net:
    driver: bridge

volumes:
  mysql_data:
